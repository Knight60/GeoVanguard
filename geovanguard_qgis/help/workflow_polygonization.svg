<svg xmlns="http://www.w3.org/2000/svg" width="340" height="667" viewBox="0 0 340 667" font-family="Segoe UI"><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="10" y="10" width="320" height="50" rx="8" fill="#FFF4DE" stroke="#D08A1E" stroke-width="1.5"/><text x="170.0" y="30" font-size="14" font-weight="bold" fill="#1F1F1F" text-anchor="middle">Classified raster</text><text x="170.0" y="48" font-size="12" fill="#444" text-anchor="middle">whole-number classes (e.g. Sentinel-2 map)</text><line x1="170.0" y1="62" x2="170.0" y2="72" stroke="#777" stroke-width="1.6"/><polygon points="170.0,77 165.0,70 175.0,70" fill="#777"/><rect x="10" y="78" width="320" height="50" rx="8" fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5"/><text x="170.0" y="98" font-size="14" font-weight="bold" fill="#1F1F1F" text-anchor="middle">Remove small patches (optional)</text><text x="170.0" y="116" font-size="12" fill="#444" text-anchor="middle">regions smaller than N pixels</text><line x1="170.0" y1="130" x2="170.0" y2="140" stroke="#777" stroke-width="1.6"/><polygon points="170.0,145 165.0,138 175.0,138" fill="#777"/><rect x="10" y="146" width="320" height="50" rx="8" fill="#E8F1FB" stroke="#4A7EBB" stroke-width="1.5"/><text x="170.0" y="166" font-size="14" font-weight="bold" fill="#1F1F1F" text-anchor="middle">Convert pixels to polygons</text><text x="170.0" y="184" font-size="12" fill="#444" text-anchor="middle">one polygon per patch of the same class</text><line x1="170.0" y1="198" x2="170.0" y2="208" stroke="#777" stroke-width="1.6"/><polygon points="170.0,213 165.0,206 175.0,206" fill="#777"/><rect x="10" y="214" width="320" height="50" rx="8" fill="#E8F1FB" stroke="#4A7EBB" stroke-width="1.5"/><text x="170.0" y="234" font-size="14" font-weight="bold" fill="#1F1F1F" text-anchor="middle">Find the shared borders</text><text x="170.0" y="252" font-size="12" fill="#444" text-anchor="middle">each border between two neighbours is one line</text><line x1="170.0" y1="266" x2="170.0" y2="276" stroke="#777" stroke-width="1.6"/><polygon points="170.0,281 165.0,274 175.0,274" fill="#777"/><rect x="10" y="282" width="320" height="50" rx="8" fill="#E8F1FB" stroke="#4A7EBB" stroke-width="1.5"/><text x="170.0" y="302" font-size="14" font-weight="bold" fill="#1F1F1F" text-anchor="middle">Smooth every border once</text><text x="170.0" y="320" font-size="12" fill="#444" text-anchor="middle">Gaussian (recommended), Chaikin, …</text><line x1="170.0" y1="334" x2="170.0" y2="344" stroke="#777" stroke-width="1.6"/><polygon points="170.0,349 165.0,342 175.0,342" fill="#777"/><rect x="10" y="350" width="320" height="65" rx="8" fill="#E8F1FB" stroke="#4A7EBB" stroke-width="1.5"/><text x="170.0" y="370" font-size="14" font-weight="bold" fill="#1F1F1F" text-anchor="middle">Rebuild the polygons</text><text x="170.0" y="388" font-size="12" fill="#444" text-anchor="middle">neighbours use the same smoothed border →</text><text x="170.0" y="403" font-size="12" fill="#444" text-anchor="middle">no gaps, no overlaps</text><line x1="170.0" y1="417" x2="170.0" y2="427" stroke="#777" stroke-width="1.6"/><polygon points="170.0,432 165.0,425 175.0,425" fill="#777"/><rect x="10" y="433" width="320" height="50" rx="8" fill="#E8F1FB" stroke="#4A7EBB" stroke-width="1.5"/><text x="170.0" y="453" font-size="14" font-weight="bold" fill="#1F1F1F" text-anchor="middle">Check every polygon</text><text x="170.0" y="471" font-size="12" fill="#444" text-anchor="middle">problem spots are smoothed more gently</text><line x1="170.0" y1="485" x2="170.0" y2="495" stroke="#777" stroke-width="1.6"/><polygon points="170.0,500 165.0,493 175.0,493" fill="#777"/><rect x="10" y="501" width="320" height="50" rx="8" fill="#E6F4EA" stroke="#3C8D50" stroke-width="1.5"/><text x="170.0" y="521" font-size="14" font-weight="bold" fill="#1F1F1F" text-anchor="middle">Smoothed polygons</text><text x="170.0" y="539" font-size="12" fill="#444" text-anchor="middle">field class_value; nodata stays empty</text><rect x="10.0" y="565" width="155.0" height="70" rx="6" fill="#FFFFFF" stroke="#C8C8C8"/><polygon points="14.0,569.0 72.0,569.0 72.0,579.3 87.5,579.3 87.5,589.7 87.5,589.7 87.5,600.0 106.1,600.0 106.1,610.3 106.1,610.3 106.1,620.7 84.4,620.7 84.4,631.0 84.4,631.0 14.0,631.0" fill="#B7D9A8"/><polygon points="161.0,569.0 72.0,569.0 72.0,579.3 87.5,579.3 87.5,589.7 87.5,589.7 87.5,600.0 106.1,600.0 106.1,610.3 106.1,610.3 106.1,620.7 84.4,620.7 84.4,631.0 84.4,631.0 161.0,631.0" fill="#F3DFA2"/><polyline points="72.0,569.0 72.0,579.3 87.5,579.3 87.5,589.7 87.5,589.7 87.5,600.0 106.1,600.0 106.1,610.3 106.1,610.3 106.1,620.7 84.4,620.7 84.4,631.0 84.4,631.0" fill="none" stroke="#333" stroke-width="1.6" stroke-linejoin="round"/><text x="87.5" y="649" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Before</text><rect x="175.0" y="565" width="155.0" height="70" rx="6" fill="#FFFFFF" stroke="#C8C8C8"/><polygon points="179.0,569.0 240.1,569.0 249.4,579.3 260.2,589.7 266.4,600.0 261.8,610.3 254.1,620.7 249.4,631.0 179.0,631.0" fill="#B7D9A8"/><polygon points="326.0,569.0 240.1,569.0 249.4,579.3 260.2,589.7 266.4,600.0 261.8,610.3 254.1,620.7 249.4,631.0 326.0,631.0" fill="#F3DFA2"/><polyline points="240.1,569.0 249.4,579.3 260.2,589.7 266.4,600.0 261.8,610.3 254.1,620.7 249.4,631.0" fill="none" stroke="#333" stroke-width="1.6" stroke-linejoin="round"/><text x="252.5" y="649" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">After</text></svg>