<svg xmlns="http://www.w3.org/2000/svg" width="340" height="531" viewBox="0 0 340 531" font-family="Segoe UI"><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="10" y="10" width="320" height="50" rx="8" fill="#FFF4DE" stroke="#D08A1E" stroke-width="1.5"/><text x="170.0" y="30" font-size="14" font-weight="bold" fill="#1F1F1F" text-anchor="middle">Polygon layer</text><text x="170.0" y="48" font-size="12" fill="#444" text-anchor="middle">polygons that do not overlap (e.g. land cover)</text><line x1="170.0" y1="62" x2="170.0" y2="72" stroke="#777" stroke-width="1.6"/><polygon points="170.0,77 165.0,70 175.0,70" fill="#777"/><rect x="10" y="78" width="320" height="50" rx="8" fill="#E8F1FB" stroke="#4A7EBB" stroke-width="1.5"/><text x="170.0" y="98" font-size="14" font-weight="bold" fill="#1F1F1F" text-anchor="middle">Find the shared borders</text><text x="170.0" y="116" font-size="12" fill="#444" text-anchor="middle">each border between two neighbours is one line</text><line x1="170.0" y1="130" x2="170.0" y2="140" stroke="#777" stroke-width="1.6"/><polygon points="170.0,145 165.0,138 175.0,138" fill="#777"/><rect x="10" y="146" width="320" height="50" rx="8" fill="#E8F1FB" stroke="#4A7EBB" stroke-width="1.5"/><text x="170.0" y="166" font-size="14" font-weight="bold" fill="#1F1F1F" text-anchor="middle">Smooth every border once</text><text x="170.0" y="184" font-size="12" fill="#444" text-anchor="middle">Gaussian (recommended), Chaikin, …</text><line x1="170.0" y1="198" x2="170.0" y2="208" stroke="#777" stroke-width="1.6"/><polygon points="170.0,213 165.0,206 175.0,206" fill="#777"/><rect x="10" y="214" width="320" height="65" rx="8" fill="#E8F1FB" stroke="#4A7EBB" stroke-width="1.5"/><text x="170.0" y="234" font-size="14" font-weight="bold" fill="#1F1F1F" text-anchor="middle">Rebuild the polygons</text><text x="170.0" y="252" font-size="12" fill="#444" text-anchor="middle">neighbours use the same smoothed border →</text><text x="170.0" y="267" font-size="12" fill="#444" text-anchor="middle">no gaps, no overlaps</text><line x1="170.0" y1="281" x2="170.0" y2="291" stroke="#777" stroke-width="1.6"/><polygon points="170.0,296 165.0,289 175.0,289" fill="#777"/><rect x="10" y="297" width="320" height="50" rx="8" fill="#E8F1FB" stroke="#4A7EBB" stroke-width="1.5"/><text x="170.0" y="317" font-size="14" font-weight="bold" fill="#1F1F1F" text-anchor="middle">Check every polygon</text><text x="170.0" y="335" font-size="12" fill="#444" text-anchor="middle">problem spots are smoothed more gently</text><line x1="170.0" y1="349" x2="170.0" y2="359" stroke="#777" stroke-width="1.6"/><polygon points="170.0,364 165.0,357 175.0,357" fill="#777"/><rect x="10" y="365" width="320" height="50" rx="8" fill="#E6F4EA" stroke="#3C8D50" stroke-width="1.5"/><text x="170.0" y="385" font-size="14" font-weight="bold" fill="#1F1F1F" text-anchor="middle">Smoothed polygons</text><text x="170.0" y="403" font-size="12" fill="#444" text-anchor="middle">same attributes as the input</text><rect x="10.0" y="429" width="155.0" height="70" rx="6" fill="#FFFFFF" stroke="#C8C8C8"/><polygon points="14.0,433.0 72.0,433.0 72.0,443.3 87.5,443.3 87.5,453.7 87.5,453.7 87.5,464.0 106.1,464.0 106.1,474.3 106.1,474.3 106.1,484.7 84.4,484.7 84.4,495.0 84.4,495.0 14.0,495.0" fill="#B7D9A8"/><polygon points="161.0,433.0 72.0,433.0 72.0,443.3 87.5,443.3 87.5,453.7 87.5,453.7 87.5,464.0 106.1,464.0 106.1,474.3 106.1,474.3 106.1,484.7 84.4,484.7 84.4,495.0 84.4,495.0 161.0,495.0" fill="#F3DFA2"/><polyline points="72.0,433.0 72.0,443.3 87.5,443.3 87.5,453.7 87.5,453.7 87.5,464.0 106.1,464.0 106.1,474.3 106.1,474.3 106.1,484.7 84.4,484.7 84.4,495.0 84.4,495.0" fill="none" stroke="#333" stroke-width="1.6" stroke-linejoin="round"/><text x="87.5" y="513" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Before</text><rect x="175.0" y="429" width="155.0" height="70" rx="6" fill="#FFFFFF" stroke="#C8C8C8"/><polygon points="179.0,433.0 240.1,433.0 249.4,443.3 260.2,453.7 266